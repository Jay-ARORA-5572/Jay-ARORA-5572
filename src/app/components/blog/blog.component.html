<section
  data-aos="fade-up"
  class="relative py-20 px-6 sm:px-10 lg:px-24 bg-gray-100 dark:bg-gray-900 overflow-hidden"
>
  <!-- Decorative Accent -->
  <div class="absolute top-0 left-0 h-full w-1 bg-gradient-to-b from-indigo-500 via-purple-500 to-pink-500 rounded-full"></div>

  <div class="max-w-6xl mx-auto pl-6 sm:pl-10">
    <h2
      class="text-3xl sm:text-4xl lg:text-5xl font-extrabold tracking-tight mb-8 text-gray-900 dark:text-white"
    >
      Latest Blog Posts
    </h2>

    <!-- Divider -->
    <div class="w-20 h-1 bg-gradient-to-r from-indigo-500 to-purple-500 mb-8 rounded-full"></div>

    <div class="grid gap-8 sm:grid-cols-2 lg:grid-cols-3">
      <div
        *ngFor="let post of posts"
        class="group p-6 bg-white dark:bg-gray-800 rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300"
      >
        <h3
          class="text-xl sm:text-2xl font-semibold mb-2 text-gray-900 dark:text-white group-hover:text-indigo-500 transition"
        >
          {{ post.title }}
        </h3>

        <p class="text-sm text-gray-500 mb-3">
          {{ post.date }}
        </p>

        <p class="text-gray-700 dark:text-gray-300 leading-relaxed mb-4">
          {{ post.content }}
        </p>

        <p class="text-sm text-gray-500">
          {{ calculateReadingTime(post.content) }}
        </p>
      </div>
    </div>
  </div>
</section>
