<div
  id="preloader"
  class="preloader fixed inset-0 flex flex-col items-center justify-center bg-white dark:bg-black z-[9999] transition-opacity duration-500"
>
  <!-- Animated Loader -->
  <div class="loader-wrapper">
    <div class="orbit orbit-1">
      <div class="dot dot-1"></div>
    </div>
    <div class="orbit orbit-2">
      <div class="dot dot-2"></div>
    </div>
    <div class="orbit orbit-3">
      <div class="dot dot-3"></div>
    </div>
    <div class="core"></div>
  </div>

  <!-- Loading text -->
  <p class="mt-8 text-gray-600 dark:text-gray-400 text-sm font-medium tracking-[0.3em] uppercase animate-pulse">
    Loading...
  </p>
</div>
